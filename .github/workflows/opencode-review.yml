name: OpenCode review

# Advisory AI review of ready PRs, shared with Pete's other repos.
# Needs a ZHIPU_API_KEY Actions secret here, and pietervw/.github must be
# readable from this repo (it holds the reusable workflow and action).
# Runs on GitHub-hosted runners unless a RUNNER Actions variable says otherwise.
# Comments never trigger a review (no issue_comment trigger on purpose).

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# One review per PR at a time; a newer push cancels the superseded run.
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Public repo: only Pete's own PRs from branches in this repo may use the
    # API key. Others' PRs, forks and Dependabot never start a review.
    # pull_request (not pull_request_target) keeps the secret away from fork code.
    if: >-
      github.event.pull_request.user.login == 'pietervw' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: pietervw/.github/.github/workflows/opencode-review.yml@v1
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
